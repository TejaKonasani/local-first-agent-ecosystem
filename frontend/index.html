<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Local-First Agent Ecosystem — a 16-agent legal & compliance platform running entirely on your local hardware. Seven role-based portals, approval gates and a verifiable audit trail."
    />
    <meta name="theme-color" content="#0E1A2B" />
    <title>Local-First Agents</title>

    <!-- Favicon: navy rounded square (#0E1A2B) with gold-300 (#E5B85C) shield -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1A2B'/%3E%3Cpath d='M32 11l17 6.2v12.3c0 10.9-7.2 19.3-17 22.5-9.8-3.2-17-11.6-17-22.5V17.2L32 11z' fill='none' stroke='%23E5B85C' stroke-width='3.6' stroke-linejoin='round'/%3E%3Cpath d='M24.5 32.5l5.2 5.2 10-11' fill='none' stroke='%23E5B85C' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <!-- Google Fonts: Fraunces (500, 600) & Inter (400, 500, 600) with preconnect and display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- AOS 2.3.4 (Animation on Scroll) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>

    <!-- GSAP 3.12.5 + ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

    <script>
      // Apply the saved (or system) theme before first paint to prevent flashes.
      (function () {
        try {
          var t = localStorage.getItem('lfae_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
