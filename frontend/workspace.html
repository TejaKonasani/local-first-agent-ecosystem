<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nushift — Law, tax and compliance, shifted into one intelligent workspace."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Workspace | Nushift</title>

    <!-- Favicon: 32px gradient circle -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238B7BFF'/%3E%3Cstop offset='100%25' stop-color='%2322D3EE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E"
    />

    <!-- Google Fonts: Sora & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- GSAP 3.12 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>

    <!-- Pre-paint Theme Script -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nushift_theme') || localStorage.getItem('lfae_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="workspace-body">
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="workspace-layout">
      <!-- 6. Left Sidebar 248px, glass, border-right only -->
      <aside id="workspace-sidebar" class="workspace-sidebar" aria-label="Sidebar Navigation">
        <div>
          <!-- Logo on top -->
          <a href="index.html" class="brand-logo" aria-label="Nushift Home">
            <span class="logo-core-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </span>
            <span>Nushift</span>
          </a>

          <!-- Nav Links -->
          <ul id="sidebar-nav-list" class="sidebar-nav-list">
            <!-- Dynamically populated by workspace.js -->
          </ul>
        </div>

        <!-- User block at the bottom -->
        <div class="sidebar-user-block">
          <div class="sidebar-user-info">
            <div id="shell-avatar" class="user-avatar-circle">?</div>
            <div style="flex: 1; min-width: 0;">
              <div id="shell-user-name" style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg);">
                User
              </div>
              <div id="shell-user-role" style="font-size: 12px; color: var(--mu);">
                Role
              </div>
            </div>
          </div>

          <button
            type="button"
            id="shell-signout-btn"
            class="btn btn-ghost btn-sm"
            style="width: 100%; justify-content: flex-start; gap: 8px; color: var(--mu);"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            <span>Sign out</span>
          </button>
        </div>
      </aside>

      <!-- Main Workspace Surface -->
      <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
        <main id="main-content" class="workspace-main">
          <!-- 6. Top row of the main area -->
          <header class="workspace-topbar" role="banner">
            <div>
              <span id="shell-role-eyebrow" class="eyebrow">WORKSPACE</span>
              <h1 id="shell-greeting" class="h2-title" style="margin-top: 4px;">Good morning</h1>
              <nav id="shell-breadcrumb" class="breadcrumb-row" aria-label="Breadcrumb"></nav>
            </div>

            <!-- Right: Theme Toggle + Notifications + Mobile Drawer Menu -->
            <div style="display: flex; align-items: center; gap: 12px;">
              <button
                type="button"
                id="sidebar-menu-btn"
                class="btn btn-ghost btn-circle mobile-menu-btn"
                aria-label="Toggle navigation drawer"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
              </button>

              <button
                type="button"
                id="shell-notif-btn"
                class="btn btn-ghost btn-circle"
                aria-label="View notifications"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              </button>

              <button
                type="button"
                class="btn btn-theme-toggle btn-circle"
                data-theme-toggle
                aria-label="Switch theme"
              ></button>
            </div>
          </header>

          <!-- Dynamic Role-Specific Content Area -->
          <div id="workspace-content" style="display: flex; flex-direction: column; gap: 28px;">
            <!-- Populated by workspace.js -->
          </div>
        </main>
      </div>
    </div>

    <!-- Sign Out Confirmation Modal Dialog -->
    <div id="signout-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="signout-title">
      <div class="glass-card card-pad-lg modal-card" style="box-shadow: var(--shadow-md);">
        <h3 id="signout-title" style="margin-bottom: 8px;">Sign out of Nushift</h3>
        <p class="text-small" style="margin-bottom: 24px;">
          Are you sure you want to end your local session? Any unsaved edits will be discarded.
        </p>
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" id="cancel-signout-btn" class="btn btn-ghost">Cancel</button>
          <button type="button" id="confirm-signout-btn" class="btn btn-primary" style="background: var(--status-error-fg);">
            Sign out
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/workspace.js"></script>
  </body>
</html>
